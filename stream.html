<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="page-title">Sports77HD - Live Stream</title>

  <!-- HLS.js untuk .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       WHATSAPP BANNER
       ========================= */

    .wa-banner {
      width: 100%;
      height: 58px;

      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;

      background: linear-gradient(
        90deg,
        #075e25,
        #16a34a
      );

      color: #fff;
      text-decoration: none;

      overflow: hidden;
    }

    .wa-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;
      border-radius: 50%;

      font-size: 21px;
    }

    .wa-content {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .wa-title {
      font-size: 13px;
      font-weight: 800;
      line-height: 16px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wa-title span {
      color: #6dff91;
    }

    .wa-subtitle {
      margin-top: 2px;

      font-size: 9px;
      line-height: 12px;

      opacity: .9;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wa-join {
      flex-shrink: 0;

      padding: 7px 12px;

      background: #fff;
      color: #128c3a;

      border-radius: 18px;

      font-size: 10px;
      font-weight: 800;
    }

    /* =========================
       STREAM BOX
       ========================= */

    .stream-box {
      position: relative;

      width: 100%;
      height: calc(100vh - 58px);

      min-height: 300px;

      background: #000;

      overflow: hidden;
    }

    /* =========================
       VIDEO PLAYER
       ========================= */

    #video-player {
      display: none;

      width: 100%;
      height: 100%;

      background: #000;

      object-fit: contain;
    }

    /* =========================
       IFRAME PLAYER
       ========================= */

    #video-iframe {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;

      background: #000;

      touch-action: auto;
    }

    /* =========================
       IKLAN / SENTUH PERTAMA
       ========================= */

    #ad-overlay {
      position: absolute;

      inset: 0;

      z-index: 10;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #ad-overlay.hidden {
      display: none;
    }

    /* =========================
       ERROR
       ========================= */

    #stream-error {
      position: absolute;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      color: #fff;
      background: #000;

      text-align: center;

      font-size: 14px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      .wa-banner {
        height: 58px;
        padding: 7px 9px;
        gap: 8px;
      }

      .wa-icon {
        width: 36px;
        height: 36px;
        min-width: 36px;

        font-size: 19px;
      }

      .wa-title {
        font-size: 12px;
      }

      .wa-subtitle {
        font-size: 8px;
      }

      .wa-join {
        padding: 7px 10px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       WHATSAPP
       ========================= -->

  <a
    href="https://whatsapp.com/channel/0029VbD5rXAJ93wYhP08tc3D"
    target="_blank"
    rel="noopener noreferrer"
    class="wa-banner"
  >

    <div class="wa-icon">
      💬
    </div>

    <div class="wa-content">

      <div class="wa-title">
        Join Saluran
        <span>sports77</span>
      </div>

      <div class="wa-subtitle">
        Dapatkan update link streaming,
        jadwal bola & info terbaru!
      </div>

    </div>

    <div class="wa-join">
      JOIN
    </div>

  </a>


  <!-- =========================
       STREAM
       ========================= -->

  <main class="stream-box">

    <!-- Player MP4 / M3U8 -->
    <video
      id="video-player"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      controlsList="nodownload"
    ></video>


    <!-- Player IFRAME -->
    <iframe
      id="video-iframe"
      src="about:blank"
      title="Live Stream"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>


    <!-- Error -->
    <div id="stream-error">
      Stream tidak dapat diputar.
    </div>


    <!-- Overlay klik pertama -->
    <div
      id="ad-overlay"
      role="button"
      aria-label="Lanjutkan ke video"
    ></div>

  </main>


  <script>

    /* =========================
       DAFTAR STREAM
       ========================= */

    const matches = {

      "desah": {
        title: "bokep indo viral",
        src: "https://aceimg.com/upload/?f=2mEaEuQg4.mp4"
      },

      "cindo": {
        title: "cindo",
        src: "https://aceimg.com/upload/?f=2mEaEuQg4.mp4"
      },

      "proplayer1": {
        title: "Barcelona vs Vallecano",
        src: "https://tribunvideo.com/f/ccyvim9v0u7"
      },

      "priplayer3": {
        title: "Aston Villa vs Arsenal",
        src: "https://tribunvideo.com/f/5quuw0w8as8"
      },

      "tembem": {
        title: "Real Madrid vs Malaga",
        src: "https://autumn-field-e635.andinirosalin3.workers.dev"
      },

      "napoli": {
        title: "Napoli vs Como",
        src: "https://starballtv010.blogspot.com/2026/08/naco.html"
      },

      "deportivo": {
        title: "Deportivo vs Valencia",
        src: "https://starballtv010.blogspot.com/2026/08/lava.html"
      },

      "alqadsiah": {
        title: "Al Qadsiah vs Al Faisaly",
        src: "https://starballtv010.blogspot.com/2026/08/qafa.html"
      },

      "intermilan": {
        title: "Cagliari vs Inter Milan",
        src: "https://starballtv010.blogspot.com/2026/08/cain.html"
      },

      "gogo": {
        title: "Lazio vs Genoa",
        src: "https://sabutv.com/server/event.m3u8?ch=12&proxy=1"
      },

      "ligaindo": {
        title: "AS Monaco vs Marseille",
        src: "https://aceimg.com/upload/?f=v5yPsxHaU.mp4"
      },

      "liga1": {
        title: "Liga 1",
        src: "https://live1.dyrur1.com/live/73576618_169bc615f1b262f8ec0017efa65425fd_1080p.m3u8?auth_key=1789217014-0-0-f13a16db08eafab219f09e67d5ef9d46"
      },

      "sp": {
        title: "Celta vs Athletic Bilbao",
        src: "https://aceimg.com/upload/?f=jQ4piDo7n.mp4"
      }

    };


    /* =========================
       AMBIL ?id=
       ========================= */

    const params =
      new URLSearchParams(window.location.search);

    const matchId =
      (params.get("id") || "")
        .trim()
        .toLowerCase();


    /* =========================
       FALLBACK
       ========================= */

    const fallbackMatch = {
      title: "Live Stream",
      src: ""
    };


    /* =========================
       STREAM AKTIF
       ========================= */

    const activeMatch =
      matches[matchId] || fallbackMatch;


    /* =========================
       ELEMENT
       ========================= */

    const video =
      document.getElementById("video-player");

    const iframe =
      document.getElementById("video-iframe");

    const errorBox =
      document.getElementById("stream-error");


    /* =========================
       JUDUL
       ========================= */

    document.title =
      "Sports77HD - " + activeMatch.title;

    document.getElementById("page-title")
      .textContent =
      "Sports77HD - " + activeMatch.title;


    /* =========================
       DETEKSI TIPE STREAM
       ========================= */

    function getStreamType(url) {

      const cleanUrl =
        url.split("?")[0].toLowerCase();

      if (
        cleanUrl.endsWith(".m3u8")
      ) {
        return "m3u8";
      }

      if (
        cleanUrl.endsWith(".mp4") ||
        cleanUrl.endsWith(".webm") ||
        cleanUrl.endsWith(".ogg")
      ) {
        return "video";
      }

      return "iframe";
    }


    /* =========================
       LOAD STREAM
       ========================= */

    let hls = null;

    function loadStream(url) {

      if (!url) {
        errorBox.style.display = "flex";
        return;
      }

      const type =
        getStreamType(url);


      /* =====================
         M3U8 / HLS
         ===================== */

      if (type === "m3u8") {

        video.style.display = "block";
        iframe.style.display = "none";

        /*
         * Browser yang support HLS
         * secara native.
         */

        if (
          video.canPlayType(
            "application/vnd.apple.mpegurl"
          )
        ) {

          video.src = url;

          video.addEventListener(
            "error",
            showError,
            { once: true }
          );

          return;
        }


        /*
         * Browser seperti Chrome Android
         * menggunakan HLS.js.
         */

        if (
          window.Hls &&
          Hls.isSupported()
        ) {

          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
          });

          hls.loadSource(url);

          hls.attachMedia(video);

          hls.on(
            Hls.Events.ERROR,
            function (
              event,
              data
            ) {

              if (
                data.fatal
              ) {

                console.error(
                  "HLS Error:",
                  data
                );

                showError();
              }

            }
          );

          return;
        }


        showError();

        return;
      }


      /* =====================
         MP4 / VIDEO
         ===================== */

      if (type === "video") {

        video.style.display = "block";
        iframe.style.display = "none";

        video.src = url;

        video.addEventListener(
          "error",
          showError,
          { once: true }
        );

        return;
      }


      /* =====================
         IFRAME
         ===================== */

      iframe.style.display = "block";
      video.style.display = "none";

      iframe.src = url;
    }


    /* =========================
       ERROR
       ========================= */

    function showError() {
      errorBox.style.display = "flex";
    }


    /* =========================
       MULAI STREAM
       ========================= */

    loadStream(
      activeMatch.src
    );


    /* =========================
       IKLAN SHOPEE
       ========================= */

    const overlay =
      document.getElementById(
        "ad-overlay"
      );

    const SHOPEE_URL =
      "https://goeco.mobi/GZVZEaC3";

    let adOpened = false;


    overlay.addEventListener(
      "click",
      function () {

        if (adOpened) {
          return;
        }

        adOpened = true;


        /*
         * Dibuka melalui aksi klik
         * langsung dari user.
         */

        window.open(
          SHOPEE_URL,
          "_blank",
          "noopener,noreferrer"
        );


        /*
         * Setelah klik pertama,
         * overlay dihilangkan agar
         * video bisa digunakan.
         */

        overlay.classList.add(
          "hidden"
        );

      },
      {
        once: true
      }
    );

  </script>

</body>
</html>
