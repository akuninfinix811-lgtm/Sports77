  <script>
    // DAFTAR PERTANDINGAN & LINK STREAMING
    const matches = {
      "liverpool": {
        title: "Liverpool vs Nottingham",
        src: "https://starballtv010.blogspot.com/2026/08/lino.html"
      },
      "leipzig": {
        title: "RB Leipzig vs M'gladbach",
        src: "https://starballtv010.blogspot.com/2026/08/lemon.html"
      },
      "bournemouth": {
        title: "Bournemouth vs Everton",
        src: "https://starballtv010.blogspot.com/2026/08/boev.html"
      },
      "levante": {
        title: "Levante vs Real Betis",
        src: "https://starballtv010.blogspot.com/2026/08/lebe.html"
      },
      "alkholood": {
        title: "Al Khlood vs Al Ahli",
        src: "https://starballtv010.blogspot.com/2026/08/khah.html"
      },
      "fiorentina": {
        title: "Fiorentina vs Frosinone",
        src: "https://starballtv010.blogspot.com/2026/08/fifr.html"
      },
      "tottenham": {
        title: "Tottenham vs Newcastle",
        src: "https://starballtv010.blogspot.com/2026/08/tone.html"
      },
      "dortmund": {

        src: "https://starballtv010.blogspot.com/2026/08/doha.html"
      },
      "sassuolo": {
        title: "Sassuolo vs Torino",

      "sevilla": {

      "intermiami": {
        title: "Inter Miami vs Montreal",
        src: "https://starballtv010.blogspot.com/2026/08/inmon.html"
      }
    };

    // Ambil parameter ?id= dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = (urlParams.get('id') || '').trim().toLowerCase();

    // Pastikan membaca matches[matchId] dengan benar
    const activeMatch = matches[matchId] || matches["liverpool"];

    // Pasang URL iframe dan Judul Halaman
    document.getElementById('video-iframe').src = activeMatch.src;
    document.getElementById('page-title').innerText = "Sports77HD - " + activeMatch.title;

    // Logika Pop-Under Shopee (Klik Pertama)
    const trigger = document.getElementById('click-trigger');
    if (trigger) {
      trigger.addEventListener('click', function(e) {
        e.preventDefault();
        window.open('https://s.shopee.co.id/2BE1TCTXbN', '_blank');
        trigger.remove();
      }, { once: true });
    }
  </script>
