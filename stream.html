<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title id="page-title">Sports77HD - Live Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    .stream-box {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    .stream-box iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    /* Overlay transparan di atas iframe untuk menangkap klik pertama */
    #ad-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #ad-overlay.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <main class="stream-box">
    <iframe
      id="video-iframe"
      src="about:blank"
      title="Live Stream"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>

    <!-- Overlay klik pertama untuk redirect iklan -->
    <div id="ad-overlay" role="button" aria-label="Lanjutkan"></div>
  </main>

  <script>
    /* =========================
       DAFTAR PERTANDINGAN
       ========================= */
    const matches = {
      "mabo": { title: "muun", src: "https://starballtv012.blogspot.com/2026/10/mabo.html" },
      "libri": { title: "player", src: "https://starballtv012.blogspot.com/2026/10/libri.html" },
      "crne": { title: "player6", src: "https://starballtv012.blogspot.com/2026/10/crne.html" },
      "bama": { title: "player 5", src: "https://starballtv012.blogspot.com/2026/10/bama.html" },
      "insh": { title: "player1", src: "https://starballtv012.blogspot.com/2026/10/insh.html" },
      "asvi": { title: "player2", src: "https://starballtv012.blogspot.com/2026/10/asvi.html" },
      "befe": { title: "player3", src: "https://starballtv012.blogspot.com/2026/10/befe.html" },
      "livi": { title: "player4", src: "https://starballtv012.blogspot.com/2026/10/livi.html" },
      "mase": { title: "fuma", src: "https://starballtv012.blogspot.com/2026/10/mase.html?m=1" },
      "beba": { title: "player6", src: "https://starballtv012.blogspot.com/2026/10/beba.html" },
      "mule": { title: "player 7", src: "https://starballtv012.blogspot.com/2026/10/mule.html" },
      "libr": { title: "player 7", src: "https://starballtv012.blogspot.com/2026/10/libr.html" },
      "atin": { title: "player 8", src: "https://starballtv012.blogspot.com/2026/10/atin.html" },
      "bage": { title: "player 9", src: "https://starballtv012.blogspot.com/2026/10/bage.html?m=1" },
      "nabo": { title: "player 10", src: "https://starballtv012.blogspot.com/2026/10/nabo.html?m=1" },
      "chto": { title: "player 11", src: "https://starballtv012.blogspot.com/2026/10/chto.html?m=1" },
      "arev": { title: "player 11", src: "https://starballtv012.blogspot.com/2026/10/arev.html?m=1" },
      "cosa": { title: "player12", src: "https://starballtv012.blogspot.com/2026/10/cosa.html?m=1" }
    };

    const params = new URLSearchParams(window.location.search);
    const matchId = (params.get("id") || "").trim().toLowerCase();
    const activeMatch = matches[matchId] || { title: "Live Stream", src: "about:blank" };

    // Set judul halaman secara konsisten
    document.title = "Sports77HD - " + activeMatch.title;

    // Load URL ke Iframe
    const iframe = document.getElementById("video-iframe");
    if (iframe) {
      iframe.src = activeMatch.src;
    }

    /* =========================
       REDIRECT TOKOPEDIA (KLIK PERTAMA & HILANG)
       ========================= */
    const TOKOPEDIA_URL = "https://vt.tokopedia.com/t/ZS9AnMEc8ELsV-4tPMa/";
    const overlay = document.getElementById("ad-overlay");
    let adOpened = false;

    overlay.addEventListener("click", function () {
      if (adOpened) return;
      adOpened = true;

      window.open(TOKOPEDIA_URL, "_blank", "noopener,noreferrer");
      overlay.classList.add("hidden"); // Langsung hilang setelah diklik
    }, { once: true });
  </script>

</body>
</html>
