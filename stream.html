<style>

.wa-join {

/* =========================
   STREAM BOX
   ========================= */

.stream-box {
  position: relative;

  width: 100%;
  height: calc(100vh - 58px);
  min-height: 300px;

  background: #000;
  overflow: hidden;
}

/* =========================
   VIDEO PLAYER
   ========================= */

#video-player {
  display: none;

  width: 100%;
  height: 100%;

  background: #000;

  object-fit: contain;
}

/* =========================
   IFRAME PLAYER
   ========================= */

#video-iframe {
  display: none;

  width: 100%;
  height: 100%;

  border: 0;
  background: #000;

  touch-action: auto;
}

/* =========================
   LOADING
   ========================= */

#loading {
  position: absolute;
  inset: 0;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
  color: #fff;

  font-size: 14px;
}

#loading.hidden {
  display: none;
}

/* =========================
   ERROR
   ========================= */

#error-box {
  position: absolute;
  inset: 0;

  z-index: 6;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  padding: 25px;

  background: #000;
  color: #fff;

  text-align: center;
}

#error-box.show {
  display: flex;
}

#error-box strong {
  font-size: 16px;
  margin-bottom: 8px;
}

#error-box span {
  max-width: 500px;
  color: #aaa;
  font-size: 12px;
  line-height: 18px;
}

/* =========================
   IKLAN / SENTUH PERTAMA
   ========================= */

#ad-overlay {
  position: absolute;
  inset: 0;

  z-index: 10;

  background: transparent;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

#ad-overlay.hidden {
  display: none;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 480px) {

  .wa-banner {
    height: 58px;
    padding: 7px 9px;
    gap: 8px;
  }

  .wa-icon {
    width: 36px;
    height: 36px;
    min-width: 36px;

    font-size: 19px;
  }

  .wa-title {
    font-size: 12px;
  }

  .wa-subtitle {
    font-size: 8px;
  }

  .wa-join {
    padding: 7px 10px;
    font-size: 9px;
  }
}
</style>

</head>

<body>

<!-- =========================

href="https://whatsapp.com/channel/0029VbD5rXAJ93wYhP08tc3D"

<!-- =========================

<main class="stream-box">

  <!-- Error -->

    <strong>Siaran tidak dapat dimuat</strong>

  </div>

  <!-- VIDEO PLAYER -->

<video

webkit-playsinline

  <!-- IFRAME PLAYER -->

  <iframe

    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen

  ></iframe>

  <!-- Overlay klik pertama -->

  <div

    aria-label="Lanjutkan ke video"
  ></div>

</main>

<script>

/* =========================
   DAFTAR STREAM
   ========================= */

const matches = {

  "bobr": {
    title: "bobr",
    src: "https://starballtv010.blogspot.com/2026/09/bobr.html"
  },

  "dopa": {
    title: "Dortmund vs Paderborn",
    src: "https://starballtv010.blogspot.com/2026/09/dopa.html"
  },

  "frmo": {
    title: "Freiburg vs M'gladbach",
    src: "https://starballtv010.blogspot.com/2026/09/frmo.html"
  },

  "asno": {
    title: "Aston Villa vs Nottingham",
    src: "https://starballtv010.blogspot.com/2026/09/asno.html"
  },

  "chhu": {
    title: "Chelsea vs Hull City",
    src: "https://starballtv010.blogspot.com/2026/09/chhu.html"
  },

  "lifu": {
    title: "Liverpool vs Fulham",
    src: "https://starballtv010.blogspot.com/2026/09/lifu.html"
  },

  "toev": {
    title: "Tottenham vs Everton",
    src: "https://starballtv010.blogspot.com/2026/09/toev.html"
  },

  "siaj": {
    title: "Fortuna Sittard vs Ajax",
    src: "https://starballtv010.blogspot.com/2026/09/siaj.html"
  },

  "suar": {
    title: "Sunderland vs Arsenal",
    src: "https://starballtv010.blogspot.com/2026/09/suar.html"
  },

  "mara": {
    title: "Real Madrid vs Rayo Vallecano",
    src: "https://starballtv010.blogspot.com/2026/09/mara.html"
  },

  "mina": {
    title: "Inter Miami vs Nashville",
    src: "https://starballtv010.blogspot.com/2026/09/mina.html"
  },

  "khna": {
    title: "Al Khaleej vs Al Nassr",
    src: "https://starballtv010.blogspot.com/2026/09/khna.html"
  },

  "gp": {
    title: "Celta vs Athletic Bilbao",
    src: "https://starballtv010.blogspot.com/2026/07/gp.html?m=1"
  }

};


/* =========================
   AMBIL ?id=
   ========================= */

const params = new URLSearchParams(
  window.location.search
);

const matchId = (
  params.get("id") || ""
)
  .trim()
  .toLowerCase();


/* =========================
   ELEMENT
   ========================= */

const video =
  document.getElementById("video-player");

const iframe =
  document.getElementById("video-iframe");

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error-box");

const errorMessage =
  document.getElementById("error-message");


/* =========================
   STREAM AKTIF
   ========================= */

const activeMatch = matches[matchId];


/* =========================
   JUDUL
   ========================= */

if (activeMatch) {

  document.title =
    "Sports77HD - " + activeMatch.title;

} else {

  document.title =
    "Sports77HD - Live Stream";

}


/* =========================
   ERROR
   ========================= */

function showError(message) {

  loading.classList.add("hidden");

  errorMessage.textContent =
    message;

  errorBox.classList.add("show");
}


/* =========================
   LOADING
   ========================= */

function hideLoading() {
  loading.classList.add("hidden");
}


/* =========================
   DETEKSI TIPE STREAM
   ========================= */

function getStreamType(url) {

  if (!url) {
    return null;
  }

  const cleanUrl =
    url.split("?")[0].toLowerCase();

  if (
    cleanUrl.endsWith(".m3u8")
  ) {
    return "m3u8";
  }

  if (
    cleanUrl.endsWith(".mp4") ||
    cleanUrl.endsWith(".webm") ||
    cleanUrl.endsWith(".ogg")
  ) {
    return "video";
  }

  return "iframe";
}


/* =========================
   HLS
   ========================= */

let hls = null;


/* =========================
   LOAD STREAM
   ========================= */

function loadStream(url) {

  if (!url) {

    showError(
      "ID siaran tidak ditemukan. Pastikan URL menggunakan ?id=nama."
    );

    return;
  }


  const type =
    getStreamType(url);


  /* =====================
     M3U8 / HLS
     ===================== */

  if (type === "m3u8") {

    video.style.display = "block";
    iframe.style.display = "none";


    /* HLS native */

    if (
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ) {

      video.src = url;

      video.addEventListener(
        "loadedmetadata",
        hideLoading,
        { once: true }
      );

      video.addEventListener(
        "error",
        function () {
          showError(
            "HLS tidak dapat diputar di browser ini."
          );
        },
        { once: true }
      );

      return;
    }


    /* HLS.js */

    if (
      window.Hls &&
      Hls.isSupported()
    ) {

      hls = new Hls({

        enableWorker: true,

        lowLatencyMode: true,

        backBufferLength: 30

      });


      hls.loadSource(url);

      hls.attachMedia(video);


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          hideLoading();

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function (
          event,
          data
        ) {

          console.error(
            "HLS Error:",
            data
          );


          if (
            data.fatal
          ) {

            if (
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ) {

              showError(
                "Gagal mengambil siaran. Server stream mungkin sedang offline atau memblokir akses browser."
              );

            } else {

              showError(
                "Terjadi error saat memuat video."
              );

            }

          }

        }
      );

      return;
    }


    showError(
      "Browser tidak mendukung HLS."
    );

    return;
  }


  /* =====================
     MP4 / VIDEO
     ===================== */

  if (type === "video") {

    video.style.display = "block";
    iframe.style.display = "none";

    video.src = url;

    video.addEventListener(
      "loadedmetadata",
      hideLoading,
      { once: true }
    );

    video.addEventListener(
      "error",
      function () {

        showError(
          "File video tidak dapat diputar."
        );

      },
      { once: true }
    );

    return;
  }


  /* =====================
     IFRAME
     ===================== */

  iframe.style.display = "block";
  video.style.display = "none";

  iframe.src = url;

  iframe.addEventListener(
    "load",
    function () {

      hideLoading();

    },
    { once: true }
  );

}


/* =========================
   CEK ID
   ========================= */

if (!matchId) {

  showError(
    "Belum ada ID pertandingan. Contoh: ?id=dopa"
  );

} else if (!activeMatch) {

  showError(
    "ID '" +
    matchId +
    "' tidak tersedia di daftar stream."
  );

} else {

  loadStream(
    activeMatch.src
  );

}


/* =========================
   IKLAN
   ========================= */

const overlay =
  document.getElementById(
    "ad-overlay"
  );

const SHOPEE_URL =
  "https://goeco.mobi/GZVZEaC3";

let adOpened = false;


overlay.addEventListener(
  "click",
  function () {

    if (adOpened) {
      return;
    }

    adOpened = true;


    window.open(
      SHOPEE_URL,
      "_blank",
      "noopener,noreferrer"
    );


    overlay.classList.add(
      "hidden"
    );

  },
  {
    once: true
  }
);


/* =========================
   CLEANUP
   ========================= */

window.addEventListener(
  "beforeunload",
  function () {

    if (hls) {

      hls.destroy();

      hls = null;

    }

  }
);

</script>
