<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Sports77HD - Live Stream</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
}

/* =========================
   WHATSAPP BANNER
   ========================= */

.wa-banner {
  width: 100%;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  background: linear-gradient(90deg, #075e25, #16a34a);
  color: #fff;
  text-decoration: none;
  overflow: hidden;
}

.wa-icon {
  width: 38px;
  height: 38px;
  min-width: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border-radius: 50%;
  font-size: 21px;
}

.wa-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.wa-title {
  font-size: 13px;
  font-weight: 800;
  line-height: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-title span {
  color: #6dff91;
}

.wa-subtitle {
  margin-top: 2px;
  font-size: 9px;
  line-height: 12px;
  opacity: .9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-join {
  flex-shrink: 0;
  padding: 7px 12px;
  background: #fff;
  color: #128c3a;
  border-radius: 18px;
  font-size: 10px;
  font-weight: 800;
}

/* =========================
   STREAM BOX
   ========================= */

.stream-box {
  position: relative;
  width: 100%;
  height: calc(100vh - 58px);
  min-height: 300px;
  background: #000;
  overflow: hidden;
}

/* =========================
   PLAYERS
   ========================= */

#video-player,
#video-iframe {
  display: none;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

#video-player {
  object-fit: contain;
}

#video-iframe {
  touch-action: auto;
}

/* =========================
   LOADING
   ========================= */

#loading {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  color: #fff;
  font-size: 14px;
}

#loading.hidden {
  display: none;
}

/* =========================
   ERROR
   ========================= */

#error-box {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 25px;
  background: #000;
  color: #fff;
  text-align: center;
}

#error-box.show {
  display: flex;
}

#error-box strong {
  font-size: 16px;
  margin-bottom: 8px;
}

#error-box span {
  max-width: 500px;
  color: #aaa;
  font-size: 12px;
  line-height: 18px;
}

/* =========================
   IKLAN / SENTUH PERTAMA
   ========================= */

#ad-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#ad-overlay.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- =========================
     WHATSAPP
     ========================= -->

<a href="https://whatsapp.com/channel/0029VbE0ay50gcfO26fbVg2r" target="_blank" rel="noopener noreferrer" class="wa-banner">
  <div class="wa-icon">💬</div>
  <div class="wa-content">
    <div class="wa-title">Join Saluran <span>sports77</span></div>
    <div class="wa-subtitle">Dapatkan update link streaming, jadwal bola & info terbaru!</div>
  </div>
  <div class="wa-join">JOIN</div>
</a>

<!-- =========================
     STREAM
     ========================= -->

<main class="stream-box">

  <div id="loading">Memuat siaran...</div>

  <div id="error-box">
    <strong>Siaran tidak dapat dimuat</strong>
    <span id="error-message">Silakan coba kembali beberapa saat lagi.</span>
  </div>

  <video
    id="video-player"
    controls
    playsinline
    webkit-playsinline
    preload="metadata"
    controlsList="nodownload"
    crossorigin="anonymous"
  ></video>

  <iframe
    id="video-iframe"
    src="about:blank"
    title="Live Stream"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen; display-capture"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-same-origin allow-presentation"
  ></iframe>

  <div id="ad-overlay" role="button" aria-label="Lanjutkan ke video"></div>

</main>

<script>
/* =========================
   DAFTAR STREAM
   ========================= */

const matches = {
  "coma": { title: "muun", src: "https://starballtv012.blogspot.com/2026/10/coma.html" },
  "liga": { title: "player", src: "https://starballtv012.blogspot.com/2026/10/liga.html" },
  "marb": { title: "player6", src: "https://starballtv012.blogspot.com/2026/10/marb.html" },
  "muar": { title: "player 5", src: "https://starballtv012.blogspot.com/2026/10/muar.html" },
  "insh": { title: "player1", src: "https://starballtv012.blogspot.com/2026/10/insh.html" },
  "asvi": { title: "player2", src: "https://starballtv012.blogspot.com/2026/10/asvi.html" },
  "befe": { title: "player3", src: "https://starballtv012.blogspot.com/2026/10/befe.html" },
  "livi": { title: "player4", src: "https://starballtv012.blogspot.com/2026/10/livi.html" },
  "mase": { title: "fuma", src: "https://starballtv012.blogspot.com/2026/10/mase.html?m=1" },
  "beba": { title: "player6", src: "https://starballtv012.blogspot.com/2026/10/beba.html" },
  "mule": { title: "player 7", src: "https://starballtv012.blogspot.com/2026/10/mule.html" },
  "libr": { title: "player 7", src: "https://starballtv012.blogspot.com/2026/10/libr.html" },
  "atin": { title: "player 8", src: "https://starballtv012.blogspot.com/2026/10/atin.html" },
  "bage": { title: "player 9", src: "https://starballtv012.blogspot.com/2026/10/bage.html?m=1" },
  "nabo": { title: "player 10", src: "https://starballtv012.blogspot.com/2026/10/nabo.html?m=1" },
  "hitt": { title: "player 11", src: "https://starballtv012.blogspot.com/2026/10/hitt.html?m=1" },
  "pevi": { title: "player 11", src: "https://starballtv012.blogspot.com/2026/10/pevi.html?m=1" },
  "mavil": { title: "player12", src: "https://starballtv012.blogspot.com/2026/10/mavil.html?m=1" }
};

/* =========================
   AMBIL ?id=
   ========================= */

const params = new URLSearchParams(window.location.search);
const matchId = (params.get("id") || "").trim().toLowerCase();

/* =========================
   ELEMENT
   ========================= */

const video = document.getElementById("video-player");
const iframe = document.getElementById("video-iframe");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error-box");
const errorMessage = document.getElementById("error-message");

/* =========================
   STREAM AKTIF & JUDUL
   ========================= */

const activeMatch = matches[matchId];

if (activeMatch) {
  document.title = "Sports77HD - " + activeMatch.title;
} else {
  document.title = "Sports77HD - Live Stream";
}

/* =========================
   ERROR & LOADING
   ========================= */

function showError(message) {
  loading.classList.add("hidden");
  errorMessage.textContent = message;
  errorBox.classList.add("show");
}

function hideLoading() {
  loading.classList.add("hidden");
}

/* =========================
   LOAD STREAM
   ========================= */

function loadStream(url) {
  if (!url) {
    showError("ID siaran tidak ditemukan.");
    return;
  }

  // Karena sumber berupa link halaman HTML blogspot, muat menggunakan iframe
  iframe.style.display = "block";
  video.style.display = "none";
  iframe.src = url;

  iframe.addEventListener("load", function () {
    hideLoading();
  }, { once: true });
}

/* =========================
   VALIDASI ID
   ========================= */

if (!matchId) {
  showError("Belum ada ID pertandingan. Contoh: ?id=coma");
} else if (!activeMatch) {
  showError("ID '" + matchId + "' tidak tersedia di daftar stream.");
} else {
  loadStream(activeMatch.src);
}

/* =========================
   IKLAN / SENTUH PERTAMA
   ========================= */

const overlay = document.getElementById("ad-overlay");
const TARGET_URL = "https://vt.tokopedia.com/t/ZS9AnMEc8ELsV-4tPMa/";
let adOpened = false;

overlay.addEventListener("click", function () {
  if (adOpened) return;
  adOpened = true;

  window.open(TARGET_URL, "_blank", "noopener,noreferrer");
  overlay.classList.add("hidden");
}, { once: true });
</script>

</body>
</html>
