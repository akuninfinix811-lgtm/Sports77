    /* =========================
       AMBIL ?id=
       ========================= */

    const params =
      new URLSearchParams(window.location.search);

    const matchId =
      (params.get("id") || "")
        .trim()
        .toLowerCase();


    /* =========================
       FALLBACK
       ========================= */

    const fallbackMatch = {
      title: "Live Stream",
      src: ""
    };


    /* =========================
       STREAM AKTIF
       ========================= */

    const activeMatch =
      matches[matchId] || fallbackMatch;


    /* =========================
       ELEMENT
       ========================= */

    const video =
      document.getElementById("video-player");

    const iframe =
      document.getElementById("video-iframe");


    /* =========================
       JUDUL
       ========================= */

    document.title =
      "Sports77HD - " + activeMatch.title;

    document.getElementById("page-title")
      .textContent =
      "Sports77HD - " + activeMatch.title;


    /* =========================
       DETEKSI TIPE STREAM
       ========================= */

    function getStreamType(url) {

      const cleanUrl =
        url.split("?")[0].toLowerCase();

      if (
        cleanUrl.endsWith(".m3u8")
      ) {
        return "m3u8";
      }

      if (
        cleanUrl.endsWith(".mp4") ||
        cleanUrl.endsWith(".webm") ||
        cleanUrl.endsWith(".ogg")
      ) {
        return "video";
      }

      return "iframe";
    }


    /* =========================
       LOAD STREAM
       ========================= */

    let hls = null;

    function loadStream(url) {

      if (!url) {
        return;
      }

      const type =
        getStreamType(url);


      /* =====================
         M3U8 / HLS
         ===================== */

      if (type === "m3u8") {

        video.style.display = "block";
        iframe.style.display = "none";


        /*
         * HLS native
         */

        if (
          video.canPlayType(
            "application/vnd.apple.mpegurl"
          )
        ) {

          video.src = url;

          return;
        }


        /*
         * HLS.js
         */

        if (
          window.Hls &&
          Hls.isSupported()
        ) {

          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
          });

          hls.loadSource(url);
          hls.attachMedia(video);

          return;
        }

        return;
      }


      /* =====================
         MP4 / VIDEO
         ===================== */

      if (type === "video") {

        video.style.display = "block";
        iframe.style.display = "none";

        video.src = url;

        return;
      }


      /* =====================
         IFRAME
         ===================== */

      iframe.style.display = "block";
      video.style.display = "none";

      iframe.src = url;
    }


    /* =========================
       MULAI STREAM
       ========================= */

    loadStream(
      activeMatch.src
    );


    /* =========================
       IKLAN
       ========================= */

    const overlay =

      );

          return;
        }

        adOpened = true;


        window.open(
          SHOPEE_URL,
          "_blank",
          "noopener,noreferrer"
        );


        overlay.classList.add(
          "hidden"
        );

      },
      {
        once: true
      }
    );
