<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Sports77HD Stream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    .stream-box { width: 100%; height: 100vh; position: relative; }
    .stream-box iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <!-- Box Pemutar Video -->
  <div class="stream-box">
    <iframe id="video-iframe" src="" title="Live Stream" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>

  <script>
    // DAFTAR PERTANDINGAN
    const matches = {
      "liverpool": {
        title: "Liverpool vs Nottingham",
        src: "https://starballtv010.blogspot.com/2026/08/lino.html"
      },
      "leipzig": {
        title: "Rb Leipzig vs M'gladbach",
        src: "https://starballtv010.blogspot.com/2026/08/lemon.html"
      },
      "bournemouth": {
        title: "Bournemouth vs Everton",
        src: "https://starballtv010.blogspot.com/2026/08/boev.html"
      },
      "levante": {
        title: "Levante vs Real Betis",
        src: "https://starballtv010.blogspot.com/2026/08/lebe.html"
      },
      "alkholood": {
        title: "Al khoolod vs Al Ahli",
        src: "https://starballtv010.blogspot.com/2026/08/khah.html"
      },
      "fiorentina": {
        title: "Fiorentina vs Frosinone",
        src: "https://starballtv010.blogspot.com/2026/08/fifr.html"
      },
      "tottenham": {
        title: "Tottenham vs Newcastle",
        src: "https://starballtv010.blogspot.com/2026/08/tone.html"
      },
      "dortmund": {
        title: "Dortmund vs Hamburger",
        src: "https://starballtv010.blogspot.com/2026/08/doha.html"
      },
      "sassuolo": {
        title: "Sassuolo vs Torino",
        src: "https://starballtv010.blogspot.com/2026/08/sato.html"
      },
      "sevilla": {
        title: "Sevilla vs Atletico Madrid",
        src: "https://starballtv010.blogspot.com/2026/08/seat.html"
      },
      "intermiami": {
        title: "Inter Miami vs Montreal",
        src: "https://starballtv010.blogspot.com/2026/08/inmon.html"
      }
    };

    // Ambil parameter ?id= dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = (urlParams.get('id') || '').trim().toLowerCase();

    // Pilih pertandingan (Default: liverpool)
    const activeMatch = matches[matchId] || matches["liverpool"];

    // Load iframe & ubah judul
    document.getElementById('video-iframe').src = activeMatch.src;
    document.getElementById('page-title').innerText = "Sports77HD - " + activeMatch.title;

    // Pop-under Shopee pada klik pertama di manapun
    let popped = false;
    window.addEventListener('click', function() {
      if (!popped) {
        window.open('https://s.shopee.co.id/2BE1TCTXbN', '_blank');
        popped = true;
      }
    });
  </script>

</body>
</html>
